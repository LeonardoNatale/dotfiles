[tracking]
enabled = true
history_days = 90

[display]
colors = true
emoji = true
max_width = 120

[filters]
ignore_dirs = [
    ".git",
    "node_modules",
    "target",
    "__pycache__",
    ".venv",
    "vendor",
]
ignore_files = [
    "*.lock",
    "*.min.js",
    "*.min.css",
]

[tee]
enabled = true
mode = "failures"
max_files = 20
max_file_size = 1048576

[telemetry]
enabled = false
consent_given = false
consent_date = "2026-05-05T10:24:53.694917+00:00"

[hooks]
# rtk's built-in `lint` filter is ESLint-only. The carbonfact `npm run lint` is
# biome-first (`biome check --fix && eslint --fix`), and bare `biome` invocations
# are mandated by AGENTS.md. Exclude them so rtk doesn't mangle their output
# or silently rewrite `biome ...` to `rtk lint ...` (which routes to eslint).
exclude_commands = ["npm run lint", "biome", "npx biome"]

[limits]
grep_max_results = 200
grep_max_per_file = 25
status_max_files = 15
status_max_untracked = 10
passthrough_max_chars = 2000
